<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheina — Portfolio</title>

  <!-- Meta básico -->
  <meta name="description" content="Portfolio de Sheina — Desarrollador de videojuegos con foco en arte y narrativa. Diseño de personajes, worldbuilding, UI/UX e implementación técnica." />
  <meta name="author" content="Lorenzo Lodigiani" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Sheina — Portfolio" />
  <meta property="og:description" content="Game developer with a strong artistic and narrative focus. Character design, worldbuilding, UI/UX and technical implementation." />
  <meta property="og:image"       content="https://img.itch.zone/aW1nLzIzOTYzMjA5LnBuZw==/original/q4hEEK.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Sheina — Portfolio" />
  <meta name="twitter:description" content="Game developer with a strong artistic and narrative focus." />
  <meta name="twitter:image"       content="https://img.itch.zone/aW1nLzIzOTYzMjA5LnBuZw==/original/q4hEEK.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <canvas id="estrellas"></canvas>
  <canvas id="animaciones"></canvas>

  <!-- Pantalla de entrada -->
  <div id="intro">
    <div id="intro-nombre">
      <h1 id="nombre">SHEINA</h1>
    </div>
    <div id="lang-select">
      <div class="lang-opciones">
        <button class="lang-btn" data-lang="es">ES</button>
        <span class="lang-sep"></span>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <!-- Sistema solar -->
  <div id="sistema-solar">
    <div id="lang-switch">
      <button class="lang-sw-btn" data-lang="es">ES</button>
      <span class="lang-sw-sep">/</span>
      <button class="lang-sw-btn" data-lang="en">EN</button>
    </div>

    <div id="universo">

      <!-- Líneas de constelación -->
      <svg id="lineas" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" pointer-events="none">

        <!-- Sol → planetas activos (sólidas) -->
        <line x1="500" y1="500" x2="584" y2="600" stroke="rgba(210,225,248,0.32)" stroke-width="0.8"/>
        <line x1="500" y1="500" x2="732" y2="562" stroke="rgba(210,225,248,0.32)" stroke-width="0.8"/>
        <line x1="500" y1="500" x2="332" y2="641" stroke="rgba(210,225,248,0.32)" stroke-width="0.8"/>
        <line x1="500" y1="500" x2="560" y2="336" stroke="rgba(210,225,248,0.32)" stroke-width="0.8"/>

        <!-- Constelación: Videojuegos→Escritos→Reseñas→LinkedIn→CV→Arte→Videojuegos -->
        <line x1="332" y1="641" x2="301" y2="263" stroke="rgba(210,225,248,0.18)" stroke-width="0.6" stroke-dasharray="3 6"/>
        <line x1="301" y1="263" x2="806" y2="243" stroke="rgba(210,225,248,0.18)" stroke-width="0.6" stroke-dasharray="3 6"/>
        <line x1="806" y1="243" x2="560" y2="336" stroke="rgba(210,225,248,0.18)" stroke-width="0.6" stroke-dasharray="3 6"/>
        <line x1="560" y1="336" x2="732" y2="562" stroke="rgba(210,225,248,0.18)" stroke-width="0.6" stroke-dasharray="3 6"/>
        <line x1="732" y1="562" x2="584" y2="600" stroke="rgba(210,225,248,0.18)" stroke-width="0.6" stroke-dasharray="3 6"/>
        <line x1="584" y1="600" x2="332" y2="641" stroke="rgba(210,225,248,0.18)" stroke-width="0.6" stroke-dasharray="3 6"/>

        <!-- Sol → planetas apagados (muy tenues) -->
        <line x1="500" y1="500" x2="301" y2="263" stroke="rgba(210,225,248,0.06)" stroke-width="0.5" stroke-dasharray="2 7"/>
        <line x1="500" y1="500" x2="806" y2="243" stroke="rgba(210,225,248,0.06)" stroke-width="0.5" stroke-dasharray="2 7"/>

        <!-- LinkedIn → Lunas -->
        <line x1="560" y1="336" x2="589" y2="360" stroke="rgba(210,225,248,0.2)" stroke-width="0.5"/>
        <line x1="560" y1="336" x2="524" y2="349" stroke="rgba(210,225,248,0.2)" stroke-width="0.5"/>
        <line x1="560" y1="336" x2="567" y2="299" stroke="rgba(210,225,248,0.2)" stroke-width="0.5"/>
      </svg>

      <div class="sol" id="sol">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" stroke="#d0ddf5" stroke-width="0.8" stroke-opacity="0.5"/>
          <circle cx="50" cy="50" r="38" stroke="#d0ddf5" stroke-width="0.4" stroke-opacity="0.3"/>
          <path d="M50 4 L53 44 L50 50 L47 44 Z" fill="#d0ddf5" fill-opacity="0.9"/>
          <path d="M50 96 L53 56 L50 50 L47 56 Z" fill="#d0ddf5" fill-opacity="0.9"/>
          <path d="M4 50 L44 47 L50 50 L44 53 Z" fill="#d0ddf5" fill-opacity="0.9"/>
          <path d="M96 50 L56 47 L50 50 L56 53 Z" fill="#d0ddf5" fill-opacity="0.9"/>
          <path d="M21 21 L45 46 L50 50 L46 45 Z" fill="#d0ddf5" fill-opacity="0.5"/>
          <path d="M79 21 L55 46 L50 50 L54 45 Z" fill="#d0ddf5" fill-opacity="0.5"/>
          <path d="M21 79 L45 54 L50 50 L46 55 Z" fill="#d0ddf5" fill-opacity="0.5"/>
          <path d="M79 79 L55 54 L50 50 L54 55 Z" fill="#d0ddf5" fill-opacity="0.5"/>
          <circle cx="50" cy="50" r="7" fill="#d0ddf5" fill-opacity="0.15" stroke="#d0ddf5" stroke-width="1"/>
          <circle cx="50" cy="50" r="3" fill="#d0ddf5"/>
        </svg>
      </div>

      <div class="orbita" style="--radio: 240px;">
        <div class="planeta planeta-cv" data-download="true" data-seccion="cv" style="--angulo: 15deg;">
          <span class="etiqueta" data-i18n="planeta.cv">CV</span>
        </div>
      </div>

      <div class="orbita" style="--radio: 130px;">
        <div class="planeta" data-seccion="arte" style="--angulo: 50deg;">
          <span class="etiqueta" data-i18n="planeta.arte">Arte</span>
        </div>
      </div>

      <div class="orbita" style="--radio: 220px;">
        <div class="planeta" data-seccion="videojuegos" style="--angulo: 140deg;">
          <span class="etiqueta" data-i18n="planeta.videojuegos">Videojuegos</span>
        </div>
      </div>

      <div class="orbita" style="--radio: 310px;">
        <div class="planeta apagado" style="--angulo: 230deg;">
          <span class="etiqueta" data-i18n="planeta.escritos">Escritos</span>
        </div>
      </div>

      <div class="orbita" style="--radio: 400px;">
        <div class="planeta apagado" style="--angulo: 320deg;">
          <span class="etiqueta" data-i18n="planeta.resenas">Reseñas</span>
        </div>
      </div>

      <div class="orbita" style="--radio: 175px;">
        <div class="planeta planeta-contacto" data-href="https://www.linkedin.com/in/lorenzo-lodigiani-8046a3265/" style="--angulo: 290deg;">
          <span class="etiqueta">LinkedIn</span>
          <div class="luna" data-href="https://www.instagram.com/mistsheina/" style="--luna-angulo: 40deg; --luna-radio: 38px;">
            <span class="luna-label">Instagram</span>
          </div>
          <div class="luna" data-href="https://mistsheina.itch.io" style="--luna-angulo: 160deg; --luna-radio: 38px;">
            <span class="luna-label">itch.io</span>
          </div>
          <div class="luna luna-email" data-email="lodigianilorenzo3@gmail.com" style="--luna-angulo: 280deg; --luna-radio: 38px;">
            <span class="luna-label" data-i18n="luna.email">Email</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Panel inferior -->
  <div id="panel-info">
    <div class="panel-arco" id="panel-texto"></div>
  </div>

  <!-- Secciones -->
  <div id="secciones">

    <!-- BIO -->
    <div class="seccion" id="sec-bio">
      <div class="sec-contenido bio-contenido">
        <h2 class="sec-titulo">Lorenzo Lodigiani</h2>
        <p class="bio-ubicacion">Buenos Aires, Argentina</p>
        <div class="bio-cuerpo">
          <p class="bio-texto" data-i18n="bio.p1"></p>
          <p class="bio-texto" data-i18n="bio.p2"></p>
        </div>
        <div class="bio-tags">
          <span class="bio-tag" data-i18n="tag.narrativa">Narrativa</span>
          <span class="bio-tag">Pixel Art</span>
          <span class="bio-tag">Worldbuilding</span>
          <span class="bio-tag">UI / UX</span>
          <span class="bio-tag">Unity</span>
          <span class="bio-tag">Unreal Engine 5</span>
          <span class="bio-tag">Ren'Py</span>
          <span class="bio-tag" data-i18n="tag.personajes">Diseño de personajes</span>
        </div>
        <div class="bio-links">
          <a class="bio-link" href="https://mistsheina.itch.io" target="_blank" rel="noopener">itch.io</a>
          <a class="bio-link" href="https://www.instagram.com/mistsheina/" target="_blank" rel="noopener">Instagram</a>
          <a class="bio-link" href="mailto:lodigianilorenzo3@gmail.com">Email</a>
        </div>
      </div>
    </div>

    <!-- ARTE -->
    <div class="seccion" id="sec-arte">
      <div class="sec-contenido ancho-completo">
        <h2 class="sec-titulo" data-i18n="sec.arte">Arte</h2>
        <div class="galeria" id="galeria-arte"></div>
      </div>
    </div>

    <!-- VIDEOJUEGOS -->
    <div class="seccion" id="sec-videojuegos">
      <div class="sec-contenido">
        <h2 class="sec-titulo" data-i18n="sec.videojuegos">Videojuegos</h2>
        <div class="cards-lista" id="lista-videojuegos"></div>
      </div>
    </div>

  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox-oculto">
    <div id="lightbox-bg"></div>
    <button id="lightbox-close">×</button>
    <div id="lightbox-contenido">
      <div id="lb-galeria">
        <button id="lb-prev">&#8249;</button>
        <img id="lb-img" src="" alt="" />
        <button id="lb-next">&#8250;</button>
        <div id="lb-counter"></div>
      </div>
      <div id="lb-info">
        <p id="lb-tag"></p>
        <p id="lb-titulo"></p>
        <p id="lb-desc"></p>
        <a id="lb-link" href="#" target="_blank" rel="noopener" data-i18n="lightbox.ver">Ver en itch.io →</a>
      </div>
    </div>
  </div>

  <!-- Botón volver -->
  <button id="btn-volver">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
      <line x1="12" y1="2"  x2="12" y2="5"  stroke="currentColor" stroke-width="1.2"/>
      <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="1.2"/>
      <line x1="2"  y1="12" x2="5"  y2="12" stroke="currentColor" stroke-width="1.2"/>
      <line x1="19" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.2"/>
    </svg>
    <span data-i18n="btn.volver">Volver al sistema</span>
  </button>

  <script src="js/main.js"></script>
</body>
</html>
