<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lorenzo Lodigiani — Game Developer</title>

  <!-- Meta básico -->
  <meta name="description" content="Game developer with a strong artistic and narrative focus. Character design, worldbuilding, UI/UX and technical implementation in Unity, Unreal Engine and Ren'Py." />
  <meta name="author" content="Lorenzo Lodigiani" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Lorenzo Lodigiani — Game Developer" />
  <meta property="og:description" content="Game developer with a strong artistic and narrative focus. Character design, worldbuilding, UI/UX and technical implementation." />
  <meta property="og:image"       content="https://img.itch.zone/aW1nLzIzOTYzMjA5LnBuZw==/original/q4hEEK.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Lorenzo Lodigiani — Game Developer" />
  <meta name="twitter:description" content="Game developer with a strong artistic and narrative focus." />
  <meta name="twitter:image"       content="https://img.itch.zone/aW1nLzIzOTYzMjA5LnBuZw==/original/q4hEEK.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Encabezado real para buscadores y lectores de pantalla.
       Va fuera de #intro porque a #intro se le aplica display:none al entrar. -->
  <h1 class="solo-lectores">Lorenzo Lodigiani — Game Developer</h1>

  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <canvas id="estrellas"></canvas>
  <canvas id="animaciones"></canvas>

  <!-- Pantalla de entrada -->
  <div id="intro">
    <div id="intro-nombre">
      <p id="nombre">Lorenzo Lodigiani</p>
    </div>
    <div id="lang-select">
      <div class="lang-opciones">
        <button class="lang-btn" data-lang="es">ES</button>
        <span class="lang-sep"></span>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <!-- Sistema solar -->
  <div id="sistema-solar">
    <div id="lang-switch">
      <button class="lang-sw-btn" data-lang="es">ES</button>
      <span class="lang-sw-sep">/</span>
      <button class="lang-sw-btn" data-lang="en">EN</button>
    </div>

    <div id="universo">

      <!-- Líneas de constelación — las dibuja dibujarLineas() en main.js
           a partir de la posición real de cada planeta, así se recalculan
           solas cuando cambia el layout (escritorio ↔ mobile) -->
      <svg id="lineas" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" pointer-events="none"></svg>

      <div class="sol" id="sol">
        <img class="sol-borde"   src="media/sun_border.svg"   alt="" />
        <img class="sol-borde-2" src="media/sun_border_2.svg" alt="" />
        <img class="sol-medio"   src="media/sun_midle.svg"    alt="Sol" />
      </div>

      <!-- El radio y el ángulo de cada órbita se definen en el CSS
           (.orbita-*), para poder reubicarlas en mobile -->
      <div class="orbita orbita-vj">
        <div class="planeta" data-seccion="videojuegos">
          <span class="etiqueta" data-i18n="planeta.videojuegos">Videojuegos</span>
        </div>
      </div>

      <div class="orbita orbita-arte">
        <div class="planeta" data-seccion="arte">
          <span class="etiqueta" data-i18n="planeta.arte">Arte</span>
        </div>
      </div>

      <div class="orbita orbita-cto">
        <div class="planeta planeta-contacto" data-seccion="contacto">
          <span class="etiqueta" data-i18n="planeta.contacto">Contacto</span>
        </div>
      </div>

      <div class="orbita orbita-cv">
        <div class="planeta planeta-cv" data-download="true" data-seccion="cv">
          <span class="etiqueta" data-i18n="planeta.cv">CV</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Tooltip flotante de planeta -->
  <div id="planeta-tooltip"></div>

  <!-- Backdrop -->
  <div id="overlay-backdrop"></div>

  <!-- Secciones -->
  <div id="secciones">

    <!-- BIO -->
    <div class="seccion" id="sec-bio">
      <div class="sec-contenido bio-contenido">
        <h2 class="sec-titulo">Lorenzo Lodigiani</h2>
        <p class="bio-ubicacion">Buenos Aires, Argentina</p>
        <div class="bio-cuerpo">
          <p class="bio-texto" data-i18n="bio.p1"></p>
          <p class="bio-texto" data-i18n="bio.p2"></p>
        </div>
        <div class="bio-tags">
          <span class="bio-tag" data-i18n="tag.narrativa">Narrativa</span>
          <span class="bio-tag">Pixel Art</span>
          <span class="bio-tag">Worldbuilding</span>
          <span class="bio-tag">UI / UX</span>
          <span class="bio-tag">Unity</span>
          <span class="bio-tag">Unreal Engine 5</span>
          <span class="bio-tag">Ren'Py</span>
          <span class="bio-tag" data-i18n="tag.personajes">Diseño de personajes</span>
        </div>
        <div class="bio-links">
          <a class="bio-link" href="https://mistsheina.itch.io" target="_blank" rel="noopener">itch.io</a>
          <a class="bio-link" href="https://www.instagram.com/mistsheina/" target="_blank" rel="noopener">Instagram</a>
          <a class="bio-link" href="mailto:lodigianilorenzo3@gmail.com">Email</a>
        </div>
      </div>
    </div>

  </div>

  <!-- Arte — tarjetas -->
  <div id="arte-cards">
    <div class="arte-grid" id="arte-grid"></div>
  </div>
  <!-- Botón de cerrar propio (mobile): volver tocando los bordes del
       backdrop ahí es más difícil. Fuera de #arte-cards a propósito,
       porque ese contenedor tiene transform y rompería su position:fixed -->
  <button id="arte-cerrar" class="cards-close" aria-label="Cerrar">×</button>

  <!-- Contacto — fichas -->
  <div id="contacto-cards">
    <div class="contacto-grid" id="contacto-grid"></div>
  </div>

  <!-- Videojuegos — tarjetas -->
  <div id="juegos-cards">
    <div class="juegos-grid" id="juegos-grid"></div>
  </div>
  <button id="juegos-cerrar" class="cards-close" aria-label="Cerrar">×</button>

  <!-- Lightbox -->
  <div id="lightbox">
    <div id="lightbox-bg"></div>
    <button id="lightbox-close">×</button>
    <div id="lightbox-contenido">
      <div id="lb-galeria">
        <button id="lb-prev">&#8249;</button>
        <img id="lb-img" src="" alt="" decoding="async" />
        <video id="lb-video" muted loop playsinline preload="metadata"></video>
        <button id="lb-next">&#8250;</button>
        <div id="lb-counter"></div>
      </div>
      <div id="lb-info">
        <p id="lb-tag"></p>
        <p id="lb-titulo"></p>
        <p id="lb-rol"></p>
        <p id="lb-desc"></p>
        <a id="lb-link" href="#" target="_blank" rel="noopener" data-i18n="lightbox.ver">Ver en itch.io →</a>
      </div>
    </div>
  </div>


  <script src="js/main.js"></script>
</body>
</html>
